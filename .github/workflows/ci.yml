name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Configure
        run: cmake --preset dev

      - name: Build
        run: cmake --build --preset dev

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Build
        run: |
          cmake --preset release
          cmake --build --preset release
      - name: Compile every example
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find examples -name '*.tc' -print0)
          test "${#files[@]}" -gt 0
          for file in "${files[@]}"; do
            ./build/release/trocto "$file" -o "${file%.tc}.bin"
          done

      - name: Upload artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: trocto-${{ matrix.os }}
          path: |
            build/dev/trocto*
            build/dev/**/trocto*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: trocto-*/**/*
          generate_release_notes: true
